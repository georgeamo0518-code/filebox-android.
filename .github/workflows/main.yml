name: Compilar Filebox APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Localizar projeto e compilar APK
        shell: bash
        run: |
          WRAPPER=$(find . -type f -name gradlew -not -path '*/.gradle/*' | head -n 1)
          if [ -z "$WRAPPER" ]; then
            echo "Não encontrei o arquivo gradlew."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$WRAPPER")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Filebox-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
